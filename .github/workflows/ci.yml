name: CI (develop)

# Reacciona a la actividad sobre la rama develop:
# se dispara al abrir el PR, al añadir commits y al mergear.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Job 1 — GitHub-hosted, va primero: actualiza el README.
  # En el PR añade la línea a la rama feature (no protegida); el GITHUB_TOKEN
  # no re-dispara workflows, así que no hay bucles.
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ github.token }}

      - name: Añadir línea de la feature al README
        if: github.event_name == 'pull_request'
        run: |
          echo "Añadida feature: ${{ github.head_ref }}" >> README.md
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "CI: añadir feature '${{ github.head_ref }}' al README"
          git push

  # Job 2 — self-hosted, depende del anterior (needs).
  # Si update-readme falla, este job ni se ejecuta.
  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validar DEV_TOKEN (secret) vs LOCAL_DEV_TOKEN (variable local)
        env:
          SECRET_DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if [ -z "$LOCAL_DEV_TOKEN" ]; then
            echo "::error::LOCAL_DEV_TOKEN no está definida en el runner"; exit 1
          fi
          if [ "$SECRET_DEV_TOKEN" = "$LOCAL_DEV_TOKEN" ]; then
            echo "OK: DEV_TOKEN coincide con LOCAL_DEV_TOKEN"
          else
            echo "::error::DEV_TOKEN != LOCAL_DEV_TOKEN"; exit 1
          fi
